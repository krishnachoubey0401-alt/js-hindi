    <div class="day">Thursday</div>

</body>
<script>
  const parent = document.querySelector('.parent')

  parent.children[1].style.color = "red ";

/*
1. const parent = document.querySelector('.parent')

.parent class wala element select karke parent variable mein store karta hai.


2. parent.children

Parent ke andar ke sirf element children ko HTMLCollection ke form mein deta hai.


3. parent.children[0]

Parent ke first child element ko access karta hai.

[0] → first child
[1] → second child


4. parent.children[0].innerHTML

First child ke andar ka HTML/text return karta hai.


5. parent.innerHTML

Parent ke andar ka complete HTML return karta hai, including child elements.


6. parent.children.length

Parent ke total element children ki count deta hai.


7. parent.children[1].style.color = "red"

Second child element ka text color red karta hai.


8. parent.firstElementChild

Parent ka first element child return karta hai.


9. parent.lastElementChild

Parent ka last element child return karta hai.


10. const dayOne = document.querySelector('.day')

Pehla .day element select karke dayOne variable mein store karta hai.


11. dayOne.parentElement

Selected element ke direct parent element ko return karta hai.

Child se parent ki taraf move karne ke liye use hota hai.


12. dayOne.nextElementSibling

Selected element ke next sibling element ko return karta hai.

Example: Monday ke baad Tuesday hai, to Monday par ye Tuesday return karega.


13. parent.childNodes

Parent ke saare child nodes return karta hai.

Isme sirf elements nahi, balki text nodes aur whitespace bhi include ho sakte hain.


14. for (let i = 0; i < parent.children.length; i++)

Parent ke saare element children par loop chalata hai.

parent.children[i] se har child ko one-by-one access kar sakte hain.
*/

</script>
