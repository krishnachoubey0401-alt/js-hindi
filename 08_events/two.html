<script>

 // is se ek timer lag jata hai ki itni der baad ye kaam kr dena iske andar hame ek handler
 // define kra hai jo ki ek fun() hai bina naam ka call back hai ye likhne k baad , lagake

// document.querySelector('h1').innerText = "kk" // isa krne se jo h1 k andar naam hai wo change ho jayega 
// ab we want that ye kaam 2 sec baad ho then : 

// setTimeout(function(){
//   document.querySelector('h1').innerText = "kk"
// }, 3000); // esa krne se ye kaam 3 sec baad hoga ab isko thoda readible bnate hai 

const changeNAme = function(){
  document.querySelector('h1').innerText = "kk" // isko ek variable me dala
}

// ab setTimeout ko call kr dege

const timeout = setTimeout(changeNAme,2000); // ye thoda readable hai 

// ab ham chahte hai ki ye nme change hone se pehle ham isko rok
// de ya button click krde or ye ruk jaye to hamne padha tha eventlistner

document.querySelector('#stop').
addEventListener('click', function(){
  clearTimeout(timeout);
  console.log("Timeout Removed Successfully");
}) 

</script>
